name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-smoke:
    name: Migration & Rollback Smoke Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smoke_db
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smoke_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Block the deploy if any required secret is missing, weak, or a placeholder.
      - name: Validate environment secrets
        working-directory: backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          MFA_JWT_SECRET: ${{ secrets.MFA_JWT_SECRET }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: node scripts/check-env.js
      - name: Deploying to Staging
        run: |
          npm run db:migrate:down -w backend
          npm run db:migrate:up -w backend
      - name: Fail on schema drift
        run: |
          pg_dump -s "$DATABASE_URL" > /tmp/schema-reup.sql
          diff -u /tmp/schema-up.sql /tmp/schema-reup.sql
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel backend/database/schema.prisma --exit-code

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: migration-smoke
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: bash scripts/deploy.sh
